name: Integrity checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Build report from published derived results
        run: python -m project2.report
      - name: Verify report length
        run: python -c "import pdfplumber; p=pdfplumber.open('output/pdf/Group_X_Report.pdf'); assert len(p.pages)==21"
